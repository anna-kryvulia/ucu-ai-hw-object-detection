base: rtdetr_data3
description: RT-DETR R50vd, every 3rd training frame, input 1080 x 1920 (test frames are not shrunk)
model:
  min_size: 1080             # test frames are at most 1920 x 1080: kept at full size
  max_size: 1920             # 4K frames: 2x downscale instead of 2.9x
train:
  batch_size: 2              # ~2x the pixels per image of the 800 x 1333 input
  epochs: 2                  # every RT-DETR run so far peaked after 1-2 epochs (notebooks 05, 08)
